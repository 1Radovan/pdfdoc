[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfdoc"
version = "0.1.3"
description = "PDF (текстовый слой + OCR сканов) → структурированный JSON с блоками, таблицами и уверенностью"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "pymupdf>=1.24.10,<2",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<6",
    "pytesseract>=0.3.10,<0.4",
    "Pillow>=10.0,<13",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pdfdoc = "pdfdoc.cli:main"

[tool.setuptools.packages.find]
include = ["pdfdoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
